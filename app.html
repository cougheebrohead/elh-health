<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vitalstack</title>
<!--BRAND_INJECT-->
<style>
:root {
  --primary: #0E1A2A;
  --accent:  #0E7C66;
  --accent-2:#0A5C4D;
  --bg:      #FBFAF6;
  --bg-card: #FFFFFF;
  --bg-soft: #F4F2EC;
  --border:  #E5E1DB;
  --text:    #0E1A2A;
  --text-dim:#4A5562;
  --text-faint:#6B7480;
  --good:    #0E7C66;
  --warn:    #B45309;
  --bad:     #B91C1C;
  --serif:   'Newsreader','Iowan Old Style','Charter',Georgia,serif;
  --sans:    'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:transparent;color:inherit}
a{color:var(--accent);text-decoration:none}

/* ─── Layout ─── */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
@media(max-width:920px){.app{grid-template-columns:1fr}}
aside{background:var(--primary);color:#E7EAEF;padding:24px 0;display:flex;flex-direction:column;gap:4px;border-right:1px solid #1B2939}
@media(max-width:920px){aside{display:none}}
aside .brand{padding:0 24px 24px;font:600 22px var(--serif);letter-spacing:-0.01em;color:#fff;display:flex;align-items:center;gap:10px}
aside .brand img{height:24px}
aside nav button{display:flex;align-items:center;gap:12px;padding:10px 24px;color:#9DA8B5;font-size:14px;font-weight:500;width:100%;text-align:left;border-left:3px solid transparent;transition:all .12s}
aside nav button:hover{color:#fff;background:rgba(255,255,255,0.04)}
aside nav button.on{color:#fff;background:rgba(255,255,255,0.08);border-left-color:var(--accent)}
aside .section{padding:18px 24px 6px;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#5C6B7C;font-weight:700}
aside .me{margin-top:auto;padding:18px 24px;border-top:1px solid #1B2939;font-size:13px;color:#9DA8B5}
aside .me .name{color:#fff;font-weight:600;margin-bottom:2px}
aside .me .role{font-size:11px;text-transform:uppercase;letter-spacing:0.06em}

main{padding:32px 36px;max-width:1440px;width:100%;overflow-x:hidden}
@media(max-width:680px){main{padding:20px}}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;gap:24px;flex-wrap:wrap}
.head h1{font:500 32px/1.05 var(--serif);letter-spacing:-0.02em}
.head .sub{color:var(--text-dim);font-size:14px;margin-top:6px}
.head .actions{display:flex;gap:8px}
.btn{padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--accent);color:#fff;border:1px solid var(--accent);transition:background .12s}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--text-dim);background:transparent}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:6px}

input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

/* ─── Cards / KPI ─── */
.row{display:grid;gap:18px}
.row.k4{grid-template-columns:repeat(4,1fr)}
.row.k3{grid-template-columns:repeat(3,1fr)}
.row.k2{grid-template-columns:repeat(2,1fr)}
@media(max-width:980px){.row.k4{grid-template-columns:repeat(2,1fr)}.row.k3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.row.k4,.row.k3,.row.k2{grid-template-columns:1fr}}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h3{font:500 14px var(--sans);font-weight:600;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.01em}
.kpi{padding:18px 20px}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);font-weight:700;margin-bottom:8px}
.kpi .value{font:600 32px/1 var(--serif);letter-spacing:-0.01em;color:var(--text)}
.kpi .delta{font-size:12px;margin-top:6px;color:var(--text-dim);display:flex;align-items:center;gap:4px}
.kpi .delta.up{color:var(--good)}
.kpi .delta.down{color:var(--bad)}

/* ─── Charts ─── */
canvas{display:block;width:100%}
.spark{height:42px}
.chart{height:240px;background:var(--bg-soft);border-radius:8px;padding:16px}

/* ─── Risk pills ─── */
.pill{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:0.02em}
.pill.crushing{background:#D1FAE5;color:#065F46}
.pill.on_track{background:#DBEAFE;color:#1E40AF}
.pill.slipping{background:#FEF3C7;color:#92400E}
.pill.ghosting{background:#FEE2E2;color:#991B1B}

/* ─── Table ─── */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 14px;font-weight:600;color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--bg-soft);cursor:pointer}
tbody tr td:first-child{font-weight:600}
.tbl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl-card .head-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.tbl-card .head-row h3{font:500 18px var(--serif);color:var(--text);margin:0}
.tbl-card .filters{display:flex;gap:8px;flex-wrap:wrap}
.tbl-card .filters select,.tbl-card .filters input{font-size:13px;padding:7px 11px}

/* ─── Empty + skeleton ─── */
.empty{padding:48px 24px;text-align:center;color:var(--text-dim)}
.empty h4{font:500 18px var(--serif);color:var(--text);margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--bg-soft),#EDEAE3,var(--bg-soft));background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:6px}
@keyframes skel{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ─── Member detail ─── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin:-8px -4px 24px;padding:0 4px;overflow-x:auto}
.tabs button{padding:12px 18px;color:var(--text-dim);font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ─── Modal ─── */
.modal{position:fixed;inset:0;background:rgba(14,26,42,0.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal-card{background:var(--bg-card);border-radius:14px;padding:32px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
.modal-card h2{font:500 24px var(--serif);margin-bottom:8px}
.modal-card .sub{color:var(--text-dim);font-size:14px;margin-bottom:24px}
label.field{display:block;margin-bottom:14px}
label.field .lab{font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;display:block}
label.field input,label.field select,label.field textarea{width:100%}

/* ─── Login ─── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,var(--bg) 0%,var(--bg-soft) 100%)}
.login-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:36px;max-width:420px;width:100%}
.login-card .brand{font:500 28px var(--serif);margin-bottom:6px;color:var(--primary)}
.login-card .lead{color:var(--text-dim);font-size:14px;margin-bottom:24px}

/* ─── Util ─── */
.hidden{display:none!important}
.muted{color:var(--text-dim)}
.right{text-align:right}
.gap{display:flex;gap:8px;align-items:center}
.spacer{flex:1}
</style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="brand" id="brand-login">Vitalstack</div>
    <p class="lead" id="login-lead">Sign in to your workspace.</p>

    <div id="sso-section">
      <button class="btn" style="width:100%;padding:13px;font-size:14px" onclick="ssoLogin()">Sign in with SSO</button>
    </div>
    <div id="pw-section">
      <label class="field"><span class="lab">Email</span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span class="lab">Password</span><input id="password" type="password" autocomplete="current-password"></label>
      <div id="login-err" class="hidden" style="color:var(--bad);font-size:13px;margin:-8px 0 14px"></div>
      <button class="btn" style="width:100%;padding:13px;font-size:14px" onclick="doLogin()">Sign in</button>
    </div>
  </div>
</div>

<!-- ─── APP ─── -->
<div id="app" class="app hidden">
  <aside>
    <div class="brand"><span id="brand-name">Vitalstack</span></div>
    <div class="section">Operate</div>
    <nav>
      <button data-view="executive" class="on">📈 Executive</button>
      <button data-view="clubs">🏢 Clubs</button>
      <button data-view="trainers">👥 Trainers</button>
      <button data-view="at-risk">⚠️ At-Risk</button>
      <button data-view="roster">👤 Roster</button>
    </nav>
    <div class="section">Outcomes</div>
    <nav>
      <button data-view="programs">📋 Programs</button>
      <button data-view="population">🧬 Population Health</button>
    </nav>
    <div class="section">Account</div>
    <nav>
      <button data-view="account">⚙️ Settings</button>
    </nav>
    <div class="me">
      <div class="name" id="me-name">—</div>
      <div class="role" id="me-role">—</div>
      <a href="#" onclick="doLogout();return false" style="color:#9DA8B5;font-size:12px;display:block;margin-top:8px">Sign out</a>
    </div>
  </aside>

  <main id="main">
    <!-- views render here -->
  </main>
</div>

<!-- ─── Modal scaffold ─── -->
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div id="modal-body" class="modal-card"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Brand + bootstrap
   ═══════════════════════════════════════════════════════════════════ */
const BRAND = window.__BRAND__ || {name:'Vitalstack',primary:'#0E1A2A',accent:'#0E7C66',sso_required:false};
document.documentElement.style.setProperty('--primary', BRAND.primary);
document.documentElement.style.setProperty('--accent',  BRAND.accent);
document.title = BRAND.app_name || BRAND.name;
document.getElementById('brand-name').textContent  = BRAND.name;
document.getElementById('brand-login').textContent = BRAND.name;
document.getElementById('login-lead').textContent  = `Sign in to ${BRAND.name}.`;
if (BRAND.sso_required) document.getElementById('pw-section').classList.add('hidden');
else                    document.getElementById('sso-section').classList.add('hidden');

let token = localStorage.getItem('vs_token');
let me = null;
const qToken = new URLSearchParams(location.search).get('token');
if (qToken) { token = qToken; localStorage.setItem('vs_token', token); history.replaceState({},'',location.pathname); }

async function api(path, opts={}) {
  const h = {'Content-Type':'application/json'};
  if (token) h['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, { ...opts, headers: { ...h, ...(opts.headers||{}) } });
  if (r.status === 401) { token = null; localStorage.removeItem('vs_token'); render(); return null; }
  if (!r.ok) {
    const d = await r.json().catch(()=>({error:'request failed'}));
    throw new Error(d.error || 'request failed');
  }
  return r.json();
}

async function doLogin() {
  const err = document.getElementById('login-err');
  err.classList.add('hidden');
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      email: document.getElementById('email').value.trim().toLowerCase(),
      password: document.getElementById('password').value,
    })});
    const d = await r.json();
    if (!r.ok || d.error) { err.textContent = d.error || 'Sign-in failed.'; err.classList.remove('hidden'); return; }
    token = d.token;
    localStorage.setItem('vs_token', token);
    render();
  } catch (e) { err.textContent = 'Connection failed.'; err.classList.remove('hidden'); }
}
async function doLogout() {
  if (token) await api('/api/logout', { method:'POST' });
  token = null;
  localStorage.removeItem('vs_token');
  render();
}
function ssoLogin() { location.href = '/api/sso/login'; }

async function render() {
  if (!token) {
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  const d = await api('/api/me');
  if (!d) return;
  me = d;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('me-name').textContent = d.user.name;
  document.getElementById('me-role').textContent = (d.user.role||'').replace('_',' ');

  // Wire nav
  document.querySelectorAll('aside nav button').forEach(b => {
    b.onclick = () => switchView(b.dataset.view);
  });

  // Members go straight to their app — redirect to /me
  if (d.user.role === 'member') {
    location.href = '/me';
    return;
  }
  switchView('executive');
}

function switchView(name) {
  document.querySelectorAll('aside nav button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  const view = VIEWS[name];
  if (!view) return;
  document.getElementById('main').innerHTML = '<div class="head"><div><h1>'+view.title+'</h1><p class="sub">Loading…</p></div></div>';
  view.render().catch(e => {
    document.getElementById('main').innerHTML = '<div class="empty"><h4>Couldn\'t load this view</h4><p>'+e.message+'</p></div>';
  });
}

function $main() { return document.getElementById('main'); }
function fmt(n) {
  if (n == null) return '—';
  if (typeof n !== 'number') n = Number(n);
  if (Math.abs(n) >= 1000) return n.toLocaleString();
  return n.toString();
}
function pct(n) { return n == null ? '—' : Math.round(n*10)/10 + '%'; }
function relativeTime(iso) {
  if (!iso) return '—';
  const d = (Date.now() - new Date(iso).getTime()) / 86400000;
  if (d < 1) return 'today';
  if (d < 2) return 'yesterday';
  if (d < 7) return Math.round(d) + 'd ago';
  if (d < 30) return Math.round(d/7) + 'w ago';
  if (d < 365) return Math.round(d/30) + 'mo ago';
  return Math.round(d/365) + 'y ago';
}

/* ═══════════════════════════════════════════════════════════════════
   Charts (canvas, no library)
   ═══════════════════════════════════════════════════════════════════ */
function sparkline(canvas, values, color) {
  const ctx = canvas.getContext('2d');
  const W = canvas.clientWidth * devicePixelRatio;
  const H = canvas.clientHeight * devicePixelRatio;
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0,0,W,H);
  if (!values.length) return;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max-min) || 1;
  ctx.strokeStyle = color; ctx.lineWidth = 2 * devicePixelRatio; ctx.beginPath();
  values.forEach((v,i) => {
    const x = (i / (values.length-1 || 1)) * W;
    const y = H - ((v - min) / range) * H * 0.85 - H*0.05;
    if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // Fill underneath
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = color + '22'; ctx.fill();
}

function bars(canvas, labels, values, color) {
  const ctx = canvas.getContext('2d');
  const W = canvas.clientWidth * devicePixelRatio;
  const H = canvas.clientHeight * devicePixelRatio;
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0,0,W,H);
  if (!values.length) return;
  const max = Math.max(...values, 1);
  const padX = W * 0.08, padY = H * 0.18;
  const innerW = W - padX*2, innerH = H - padY*2;
  const bw = innerW / values.length * 0.7;
  const gap = innerW / values.length * 0.3;
  ctx.fillStyle = color;
  values.forEach((v,i) => {
    const x = padX + i * (bw + gap);
    const h = (v / max) * innerH;
    ctx.fillRect(x, padY + innerH - h, bw, h);
  });
  // Labels
  ctx.fillStyle = '#6B7480'; ctx.font = (10*devicePixelRatio) + 'px Inter';
  ctx.textAlign = 'center';
  labels.forEach((l,i) => {
    const x = padX + i * (bw + gap) + bw/2;
    ctx.fillText(l, x, H - 4*devicePixelRatio);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   VIEWS
   ═══════════════════════════════════════════════════════════════════ */
const VIEWS = {};

VIEWS.executive = { title: 'Executive Overview', async render() {
  const [k, growth, eng, coh, pop] = await Promise.all([
    api('/api/exec/kpis'),
    api('/api/exec/growth?days=90'),
    api('/api/exec/engagement-curve'),
    api('/api/exec/cohorts'),
    api('/api/population-health').catch(() => null),
  ]);

  const html = `
    <div class="head">
      <div>
        <h1>${BRAND.name} — Executive view</h1>
        <p class="sub">As of ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})} · ${k.sites_total} sites · ${fmt(k.members_total)} members</p>
      </div>
    </div>
    <div class="row k4">
      <div class="kpi card">
        <div class="label">Active members</div>
        <div class="value">${fmt(k.members_total)}</div>
        <div class="delta ${k.growth_pct>0?'up':k.growth_pct<0?'down':''}">${k.growth_pct==null?'':(k.growth_pct>0?'▲':'▼')+' ' + Math.abs(k.growth_pct||0) + '% MoM'}</div>
      </div>
      <div class="kpi card">
        <div class="label">7-day active</div>
        <div class="value">${fmt(k.members_7d)}</div>
        <div class="delta">${pct(k.members_total ? k.members_7d / k.members_total * 100 : 0)} of base</div>
      </div>
      <div class="kpi card">
        <div class="label">30-day active</div>
        <div class="value">${fmt(k.members_30d)}</div>
        <div class="delta">${pct(k.members_total ? k.members_30d / k.members_total * 100 : 0)} of base</div>
      </div>
      <div class="kpi card">
        <div class="label">Engagement avg</div>
        <div class="value">${k.avg_engagement || '—'}</div>
        <div class="delta">${fmt(k.risk_buckets.crushing)} crushing · ${fmt(k.risk_buckets.ghosting)} ghosting</div>
      </div>
    </div>

    <div class="row k2" style="margin-top:18px">
      <div class="card">
        <h3>New members — last 90 days</h3>
        <canvas id="growthChart" class="chart"></canvas>
      </div>
      <div class="card">
        <h3>Engagement distribution</h3>
        <canvas id="engChart" class="chart"></canvas>
      </div>
    </div>

    <div class="row k2" style="margin-top:18px">
      <div class="tbl-card">
        <div class="head-row"><h3>Cohort retention</h3></div>
        <table>
          <thead><tr><th>Signup month</th><th>Cohort size</th><th>Active 30d</th><th>Retention</th></tr></thead>
          <tbody>
            ${(coh.cohorts||[]).map(c=>`<tr>
              <td>${c.cohort}</td>
              <td>${fmt(c.cohort_size)}</td>
              <td>${fmt(c.still_active)}</td>
              <td><b>${pct(c.retention_pct)}</b></td>
            </tr>`).join('') || '<tr><td colspan=4 class=muted>No cohorts yet.</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="card">
        <h3>Risk distribution</h3>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px">
          <div><div class="muted" style="font-size:12px;margin-bottom:4px">Crushing</div><div style="font:600 24px var(--serif);color:var(--good)">${fmt(k.risk_buckets.crushing)}</div></div>
          <div><div class="muted" style="font-size:12px;margin-bottom:4px">On track</div><div style="font:600 24px var(--serif)">${fmt(k.risk_buckets.on_track)}</div></div>
          <div><div class="muted" style="font-size:12px;margin-bottom:4px">Slipping</div><div style="font:600 24px var(--serif);color:var(--warn)">${fmt(k.risk_buckets.slipping)}</div></div>
          <div><div class="muted" style="font-size:12px;margin-bottom:4px">Ghosting</div><div style="font:600 24px var(--serif);color:var(--bad)">${fmt(k.risk_buckets.ghosting)}</div></div>
        </div>
        ${pop && pop.glp1 && pop.glp1.members_in_program ? `
        <h3 style="margin-top:24px">GLP-1 cohort</h3>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px;font-size:14px">
          <div>Members: <b>${fmt(pop.glp1.members_in_program)}</b></div>
          <div>Avg weight Δ: <b>${pop.glp1.avg_weight_kg_delta || '—'} kg</b></div>
          <div>Avg HbA1c Δ: <b>${pop.glp1.avg_hba1c_delta || '—'}</b></div>
          <div>Avg LDL Δ: <b>${pop.glp1.avg_ldl_delta || '—'}</b></div>
        </div>` : ''}
      </div>
    </div>
  `;
  $main().innerHTML = html;

  // Charts
  sparkline(document.getElementById('growthChart'),
            (growth.series||[]).map(s => s.new_members),
            '#0E7C66');
  bars(document.getElementById('engChart'),

VIEWS.roster = { title: 'Roster', async render() {
  const filters = window.__rosterFilters || { q:'', site_id:'', risk_tier:'' };
  const sites = await api('/api/sites');
  const params = new URLSearchParams();
  if (filters.q) params.set('q', filters.q);
  if (filters.site_id) params.set('site_id', filters.site_id);
  if (filters.risk_tier) params.set('risk_tier', filters.risk_tier);
  params.set('limit', '200');
  const d = await api('/api/roster?' + params);

  $main().innerHTML = `
    <div class="head"><div><h1>Member roster</h1><p class="sub">${fmt(d.total)} members · click any row to drill in</p></div></div>
    <div class="tbl-card">
      <div class="head-row">
        <h3>${fmt(d.total)} members</h3>
        <div class="filters">
          <input type="search" placeholder="Search name or email" id="r-q" value="${filters.q}">
          <select id="r-site"><option value="">All sites</option>${sites.sites.map(s=>`<option value="${s.id}" ${s.id===filters.site_id?'selected':''}>${s.name}</option>`).join('')}</select>
          <select id="r-risk"><option value="">All risk</option><option value="crushing">Crushing</option><option value="on_track">On track</option><option value="slipping">Slipping</option><option value="ghosting">Ghosting</option></select>
        </div>
      </div>
      <table>
        <thead><tr><th>Member</th><th>Site</th><th>Trainer</th><th>Score</th><th>Status</th><th>Last login</th><th>Joined</th></tr></thead>
        <tbody>
          ${d.rows.map(m=>`<tr onclick="openMember('${m.id}')">
            <td>${m.name}<br><span class="muted" style="font-size:12px">${m.email}</span></td>
            <td class=muted>${m.site_name||'—'}</td>
            <td class=muted>${m.trainer_name||'—'}</td>
            <td><b>${m.score||'—'}</b></td>
            <td>${m.risk_tier ? '<span class="pill '+m.risk_tier+'">'+m.risk_tier.replace('_',' ')+'</span>' : '—'}</td>
            <td class=muted>${relativeTime(m.last_login_at)}</td>
            <td class=muted>${relativeTime(m.joined_at)}</td>
          </tr>`).join('') || '<tr><td colspan=7 class=empty><h4>No members match these filters</h4></td></tr>'}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('r-q').oninput = e => { filters.q = e.target.value; window.__rosterFilters = filters; clearTimeout(window.__rt); window.__rt = setTimeout(()=>switchView('roster'),300); };
  document.getElementById('r-site').onchange = e => { filters.site_id = e.target.value; window.__rosterFilters = filters; switchView('roster'); };
  document.getElementById('r-risk').onchange = e => { filters.risk_tier = e.target.value; window.__rosterFilters = filters; switchView('roster'); };
  document.getElementById('r-risk').value = filters.risk_tier || '';
}};

/* ═══════════════════════════════════════════════════════════════════
   Member drill-down
   ═══════════════════════════════════════════════════════════════════ */
async function openMember(memberId) {
  const d = await api('/api/members/' + memberId + '/overview');
  document.getElementById('modal-body').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
      <div>
        <h2>${d.user.name}</h2>
        <p class="sub">${d.user.email}</p>
      </div>
      <button class="btn ghost sm" onclick="closeModal()">Close</button>
    </div>
    <div class="tabs" id="m-tabs">
      <button class="on" data-mt="overview">Overview</button>
      <button data-mt="nutrition">Nutrition</button>
      <button data-mt="programs">Programs</button>
      <button data-mt="messages">Messages</button>
      <button data-mt="audit">Audit</button>
    </div>
    <div id="mt-overview">
      <div class="row k2">
        <div><div class="muted" style="font-size:12px">Site</div><b>${d.user.site_name||'—'}</b></div>
        <div><div class="muted" style="font-size:12px">Trainer</div><b>${d.user.trainer_name||'—'}</b></div>
        <div><div class="muted" style="font-size:12px">Engagement</div><b>${(d.engagement||{}).score || '—'} <span class="pill ${(d.engagement||{}).risk_tier||''}">${((d.engagement||{}).risk_tier||'').replace('_',' ')}</span></b></div>
        <div><div class="muted" style="font-size:12px">Last login</div><b>${relativeTime(d.user.last_login_at)}</b></div>
      </div>
      <h3 style="margin-top:18px">Weight (last 30 days)</h3>
      <canvas id="m-weight" class="chart" style="height:140px"></canvas>
    </div>
    <div id="mt-nutrition" class="hidden">
      <table style="margin-top:8px"><thead><tr><th>Date</th><th>Cal</th><th>Pro</th><th>Carb</th><th>Fat</th></tr></thead>
      <tbody>${d.nutrition_30d.slice(0,14).map(n=>`<tr><td>${n.date}</td><td>${fmt(n.calories)}</td><td>${fmt(n.protein)}</td><td>${fmt(n.carbs)}</td><td>${fmt(n.fat)}</td></tr>`).join('') || '<tr><td colspan=5 class=muted>No meals logged.</td></tr>'}</tbody></table>
    </div>
    <div id="mt-programs" class="hidden">
      ${d.enrollments.length ? d.enrollments.map(e=>`<div class="card" style="margin-top:8px"><b>${e.program_name}</b><br><span class="muted" style="font-size:12px">${e.status} · started ${e.started_at} · ${e.adherence_pct||0}% adherence</span></div>`).join('') : '<p class=muted>Not enrolled.</p>'}
    </div>
    <div id="mt-messages" class="hidden">
      ${d.messages.length ? d.messages.map(m=>`<div style="margin-top:8px;padding:10px;background:var(--bg-soft);border-radius:8px"><div class="muted" style="font-size:11px">${relativeTime(m.sent_at)}${m.is_nudge?' · nudge':''}</div>${m.body}</div>`).join('') : '<p class=muted>No messages.</p>'}
    </div>
    <div id="mt-audit" class="hidden"><p class=muted>Loading…</p></div>
  `;
  document.getElementById('modal').classList.add('on');
  document.querySelectorAll('#m-tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#m-tabs button').forEach(x => x.classList.toggle('on', x===b));
    ['overview','nutrition','programs','messages','audit'].forEach(t =>
      document.getElementById('mt-'+t).classList.toggle('hidden', t !== b.dataset.mt));
    if (b.dataset.mt === 'audit') loadMemberAudit(memberId);
  });

  // Render weight chart
  const ws = (d.weight_series||[]).slice().reverse().map(w => Number(w.weight_kg));
  if (ws.length) sparkline(document.getElementById('m-weight'), ws, '#0E7C66');
}

async function loadMemberAudit(memberId) {
  try {
    const d = await api('/api/members/' + memberId + '/audit');
    document.getElementById('mt-audit').innerHTML = d.trail.length
      ? '<table style="margin-top:8px"><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead><tbody>' +
        d.trail.map(a => `<tr><td>${relativeTime(a.created_at)}</td><td>${(a.actor_role||'').replace('_',' ')}</td><td>${a.action}</td></tr>`).join('') +
        '</tbody></table>'
      : '<p class=muted>No audit entries.</p>';
  } catch (e) {
    document.getElementById('mt-audit').innerHTML = '<p class=muted>Audit access requires org_admin.</p>';
  }
}

      <div><h2>${d.program.name}</h2><p class="sub">${d.program.description||''}</p></div>
      <button class="btn ghost sm" onclick="closeModal()">Close</button>
    </div>

      <div><div class="muted" style="font-size:12px">Type</div><b>${(d.program.program_type||'').replace('_',' ')}</b></div>

function openProgramModal() {
  document.getElementById('modal-body').innerHTML = `
    <h2>New program</h2>
    <p class="sub">Build a workout + nutrition + content campaign for your members.</p>
    <label class="field"><span class="lab">Name</span><input id="np-name" placeholder="e.g. Summer Cut"></label>
    <label class="field"><span class="lab">Type</span><select id="np-type"><option value="campaign">Campaign</option><option value="workout_template">Workout template</option><option value="nutrition_template">Nutrition template</option><option value="combined">Combined</option></select></label>
    <label class="field"><span class="lab">Duration (days)</span><input id="np-duration" type="number" value="28"></label>
    <label class="field"><span class="lab">Target segment</span><input id="np-segment" placeholder="general / glp1 / postpartum / pre-diabetes"></label>
    <label class="field"><span class="lab">Description</span><textarea id="np-desc" rows="3"></textarea></label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitProgram()">Create</button>
    </div>
  `;
  document.getElementById('modal').classList.add('on');
}

async function submitProgram() {
  const body = {
    name: document.getElementById('np-name').value.trim() || 'Untitled',
    program_type: document.getElementById('np-type').value,
    duration_days: Number(document.getElementById('np-duration').value || 28),
    target_segment: document.getElementById('np-segment').value.trim() || null,
    description: document.getElementById('np-desc').value.trim(),
    is_org_wide: true,
  };
  body.slug = body.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  try {
    await api('/api/programs', { method:'POST', body: JSON.stringify(body) });
    closeModal();
    switchView('programs');
  } catch (e) { alert(e.message); }
}

function closeModal() { document.getElementById('modal').classList.remove('on'); }

render();
</script>
